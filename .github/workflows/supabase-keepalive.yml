name: Supabase keep-alive

# Free-tier Supabase projects are paused after ~7 days without activity.
# This runs one read-only query every 3 days so the project stays active.
# It only SELECTs a single id from the public `destinations` table (anon
# key, RLS-allowed read) — nothing is written.

on:
  schedule:
    # 06:00 UTC on days 1, 4, 7, ... of every month (gap is never > 3 days).
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read-only query against Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY repository secrets are not set"
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/destinations?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $status"
          [ "$status" = "200" ]
